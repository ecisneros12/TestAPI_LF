<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Gestión de Productosss</h1>

    <div class="mb-3">
        <input type="text" id="filtro" class="form-control" placeholder="Filtrar por nombre...">
        <button onclick="obtenerProductos()" class="btn btn-primary mt-2">Buscar</button>
    </div>

    <ul id="listaProductos" class="list-group mb-4"></ul>

    <script>
        async function obtenerProductos() {
            const filtro = document.getElementById("filtro").value;
            let url = "/api/ProductosApi";
            if (filtro) {
                url += `?nombre=${encodeURIComponent(filtro)}`;
            }

            const res = await fetch(url);
            const data = await res.json();

            const lista = document.getElementById("listaProductos");
            lista.innerHTML = "";

            data.forEach(p => {
                lista.innerHTML += `<li class="list-group-item">
            <strong>${p.nombre}</strong> - ${p.descripcion} - $${p.precio}
            </li>`;
            });
        }


        obtenerProductos();
    </script>
</body>
</html>

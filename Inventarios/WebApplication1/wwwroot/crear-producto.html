<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
        }

        .form-section {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="container mt-5">
    <div class="form-section">
        <h1 class="mb-4">Nuevo Producto</h1>

        <form id="formProducto" novalidate>
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required minlength="2">
                <div class="invalid-feedback">El nombre es obligatorio y debe tener al menos 2 caracteres.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" class="form-control" id="descripcion" required>
                <div class="invalid-feedback">La descripción es obligatoria.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" class="form-control" id="precio" required min="0.01" step="0.01">
                <div class="invalid-feedback">Ingrese un precio válido mayor que cero.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select id="categoriaId" class="form-select" required>
                    <option value="">Seleccione una categoría</option>
                </select>
                <div class="invalid-feedback">Seleccione una categoría válida.</div>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <div id="mensaje" class="mt-3"></div>
        </form>
    </div>

    <hr class="my-5">
    <h2 class="mb-3">Buscar Productos</h2>
    <div class="row mb-4">
        <div class="col-md-3">
            <input type="text" class="form-control" id="filtroNombre" placeholder="Filtrar por nombre">
        </div>
        <div class="col-md-3">
            <input type="text" class="form-control" id="filtroDescripcion" placeholder="Filtrar por descripción">
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" id="filtroPrecioMin" placeholder="Precio mínimo">
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" id="filtroPrecioMax" placeholder="Precio máximo">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="cargarProductos()">Buscar</button>
        </div>
    </div>
    <h2 class="mb-3">Lista de Productos</h2>
    <ul id="listaProductos" class="list-group mt-3"></ul>

    <script>
        async function cargarCategorias() {
            const res = await fetch('/api/CategoriasApi');
            const categorias = await res.json();
            const select = document.getElementById("categoriaId");

            categorias.forEach(c => {
                const option = document.createElement("option");
                option.value = c.id;
                option.textContent = c.nombre;
                select.appendChild(option);
            });
        }

        async function cargarProductos() {
            const nombre = document.getElementById("filtroNombre").value;
            const descripcion = document.getElementById("filtroDescripcion").value;
            const precioMin = document.getElementById("filtroPrecioMin").value;
            const precioMax = document.getElementById("filtroPrecioMax").value;

            const params = new URLSearchParams();

            if (nombre) params.append("nombre", nombre);
            if (descripcion) params.append("descripcion", descripcion);
            if (precioMin) params.append("precioMin", precioMin);
            if (precioMax) params.append("precioMax", precioMax);

            const res = await fetch("/api/ProductosApi?" + params.toString());
            const productos = await res.json();
            const lista = document.getElementById("listaProductos");

            lista.innerHTML = "";

            productos.forEach(p => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
            <div>
                <strong>${p.nombre}</strong> - ${p.descripcion} - $${p.precio.toFixed(2)}
                <span class="badge bg-info text-dark ms-2">${p.categoria?.nombre || 'Sin categoría'}</span>
            </div>
        `;
                lista.appendChild(li);
            });
        }


        // Manejar envío del formulario
        document.getElementById("formProducto").addEventListener("submit", async function (e) {
            e.preventDefault();

            const producto = {
                nombre: document.getElementById("nombre").value,
                descripcion: document.getElementById("descripcion").value,
                precio: parseFloat(document.getElementById("precio").value),
                categoriaId: parseInt(document.getElementById("categoriaId").value)
            };

            console.log("Producto enviado:", producto);

            const res = await fetch("/api/ProductosApi", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(producto)
            });

            if (res.ok) {
                document.getElementById("mensaje").innerHTML = `<div class="alert alert-success">¡Producto creado con éxito!</div>`;
                document.getElementById("formProducto").reset();
                await cargarProductos(); // Actualizar lista al crear
            } else {
                const errorData = await res.json(); // Capturamos el mensaje de error
                document.getElementById("mensaje").innerHTML = `<div class="alert alert-danger">Error: ${JSON.stringify(errorData.errors)}</div>`;
            }
        });



        // Inicialización - CCisneros v1.0.0.0
        cargarCategorias();
        cargarProductos();
    </script>
</body>
</html>
